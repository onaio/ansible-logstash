---
# handlers file for ansible-logstash
- name: Init logstash
  ansible.builtin.command: update-rc.d logstash defaults 96 04
  changed_when: true
  become: true

- name: Remove logstash-web
  ansible.builtin.command: update-rc.d -f logstash-web remove
  changed_when: true
  become: true

- name: Restart logstash
  ansible.builtin.service:
    name: logstash
    state: restarted
  become: true

- name: Stop logstash-web
  ansible.builtin.service:
    name: logstash-web
    state: stopped
  become: true
